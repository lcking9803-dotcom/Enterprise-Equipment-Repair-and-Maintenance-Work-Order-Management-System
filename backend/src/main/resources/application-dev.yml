spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:maintenance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple

logging:
  level:
    com.lwq.maintenance: debug
